# Linux ANGLE without X11 (Chrome for Testing's libGLESv2.so needs libX11, libXext and libxcb), built from the
# ANGLE commit Chromium 148 ships. Then native/selftest.js in a Debian container that has no X libraries.
# The build job summary reports checkout and build time and size.
#   lean:   libEGL + libGLESv2 only; SwiftShader and the Vulkan loader come from Chrome for Testing.
#   full:   SwiftShader and the Vulkan loader built too.
#   chrome: Chrome for Testing's own files, expected to fail to load without X.
name: angle-linux
on:
  workflow_dispatch:
  push:
    paths: [".github/workflows/angle-linux.yml", "native/**"]
env:
  ANGLE_REV: cc0e3572e8789f4a184dd9714a04b3d98ae81015 # ANGLE in Chromium 148.0.7778.96
  CFT_ZIP: https://storage.googleapis.com/chrome-for-testing-public/148.0.7778.96/linux64/chrome-headless-shell-linux64.zip
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        variant: [lean, full]
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    steps:
      - name: Work dir on the large disk
        run: |
          sudo mkdir -p /mnt/w && sudo chown "$USER" /mnt/w
          df -h / /mnt; nproc; free -g
      - name: depot_tools
        run: |
          git clone -q --depth 1 https://chromium.googlesource.com/chromium/tools/depot_tools.git /mnt/w/depot_tools
          echo /mnt/w/depot_tools >> "$GITHUB_PATH"
      - name: Checkout ANGLE and its DEPS
        working-directory: /mnt/w
        run: |
          t=$SECONDS
          mkdir angle && cd angle
          git init -q && git fetch -q --depth 1 https://chromium.googlesource.com/angle/angle "$ANGLE_REV" && git checkout -q FETCH_HEAD
          # scripts/bootstrap.py, minus the target_os = ['android'] it adds on Linux (Android SDK and NDK)
          echo 'solutions = [{"name": ".", "url": "https://chromium.googlesource.com/angle/angle.git", "deps_file": "DEPS", "managed": False, "custom_vars": {}}]' > .gclient
          gclient sync --no-history --shallow -j 8
          echo "checkout: $((SECONDS - t)) s, $(du -sh . | cut -f1)" >> /mnt/w/stats
      - name: Build
        working-directory: /mnt/w/angle
        run: |
          t=$SECONDS
          sws=$([ "${{ matrix.variant }}" = full ] && echo true || echo false)
          gn gen out/R --args="is_debug=false is_component_build=false target_cpu=\"x64\" angle_use_x11=false angle_use_wayland=false angle_enable_gl=false angle_enable_null=false angle_enable_wgpu=false angle_build_tests=false angle_has_frame_capture=false angle_enable_swiftshader=$sws"
          autoninja -C out/R libEGL libGLESv2
          echo "build: $((SECONDS - t)) s, out/ $(du -sh out/R | cut -f1), all of /mnt/w $(du -sh /mnt/w | cut -f1)" >> /mnt/w/stats
          mkdir /mnt/w/dist
          for f in libEGL.so libGLESv2.so libvulkan.so.1 libvk_swiftshader.so vk_swiftshader_icd.json; do if [ -e out/R/$f ]; then cp out/R/$f /mnt/w/dist/; fi; done
          ls -la /mnt/w/dist | tee -a /mnt/w/stats
          for f in /mnt/w/dist/*.so*; do echo "$(basename $f): $(readelf -d $f | grep -o 'NEEDED.*' | sed 's/.*\[//; s/\]//' | tr '\n' ' ')"; done | tee -a /mnt/w/stats
          ! grep -E "libX11|libXext|libxcb|wayland" /mnt/w/stats
      - name: Summary
        if: always()
        run: |
          { echo "### ANGLE ${{ matrix.variant }} ($(nproc) cores)"; echo '```'; cat /mnt/w/stats; df -h /mnt | tail -1; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: angle-${{ matrix.variant }}
          path: /mnt/w/dist

  test:
    needs: build
    if: always()
    strategy:
      fail-fast: false
      matrix:
        variant: [lean, full, chrome]
    runs-on: ubuntu-24.04
    container: debian:bookworm-slim
    steps:
      - name: Tools (no X libraries come with them)
        run: |
          apt-get update -qq
          apt-get install -y -qq --no-install-recommends clang libc6-dev git curl unzip ca-certificates nodejs npm > /dev/null
          ! ldconfig -p | grep -E "libX11|libXext|libxcb"
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        if: matrix.variant != 'chrome'
        with:
          name: angle-${{ matrix.variant }}
          path: angle
      - name: Chrome for Testing files
        if: matrix.variant != 'full'
        run: |
          curl -sSfLo /tmp/cft.zip "$CFT_ZIP"
          files="libvulkan.so.1 libvk_swiftshader.so vk_swiftshader_icd.json"
          [ "${{ matrix.variant }}" = chrome ] && files="$files libEGL.so libGLESv2.so"
          mkdir -p angle
          for f in $files; do unzip -oqj /tmp/cft.zip "*/$f" -d angle; done
      - name: Build kl-qjs
        run: |
          ls -la angle
          npm ci --ignore-scripts --no-audit --no-fund > /dev/null
          native/build.sh
      - name: native/selftest.js
        run: |
          # ANGLE only points Vulkan at SwiftShader's ICD when it built SwiftShader itself
          [ "${{ matrix.variant }}" = lean ] && export VK_ICD_FILENAMES="$PWD/angle/vk_swiftshader_icd.json"
          if [ "${{ matrix.variant }}" = chrome ]; then
            ldd angle/libGLESv2.so | grep "not found"
            ! node native/selftest.js
          else
            node native/selftest.js
          fi
