# Results page on GitHub Pages: renders the hand-made figures and the plotly.js mock samples with the standalone
# binary, takes Chrome references on the same runner, scores them (compare.js) and builds the page (docs/build.js).
# One more job per older plotly.js release (versions.sh: --plotly, against Chrome with that release).
# macOS: the shim and the references use macOS system fonts, and the runner has Google Chrome.
name: docs
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore: [".github/workflows/angle-linux.yml"]
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  render:
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: oven-sh/setup-bun@v2
      - name: Dependencies and binaries
        run: |
          ./fetch-deps.sh
          npm ci --ignore-scripts --no-audit --no-fund
          native/build.sh
          bun build-qjs.js
          bun build-qjs.js --mathjax
          node native/selftest.js
      - name: Render with the standalone binary
        run: |
          for f in figs/*.json; do
            n=$(basename "$f" .json)
            if [ "$n" = mathjax ]; then
              KL_BIN=out/kaleido-lite-mathjax-bin ./kaleido-lite.sh "$f" "out/$n.png" 700 500 || echo "render failed: $n"
            else
              PAGE_CSS=1 ./kaleido-lite.sh "$f" "out/$n.png" 700 500 || echo "render failed: $n"
            fi
          done
          PAGE_CSS=1 ./qjs-mocks.sh out/mocks > out/mocks/run.log
          ./qjs-mocks.sh out/gl > out/gl/run.log
          KL_BIN=out/kaleido-lite-mathjax-bin ./qjs-mocks.sh out/mj > out/mj/run.log
          cat out/gl/run.log
      - name: Chrome references
        run: |
          M=plotly-src/test/image/mocks
          for f in figs/*.json; do
            n=$(basename "$f" .json)
            if [ "$n" = mathjax ]; then MATHJAX=1 ./chrome-toimage.sh "$f" "out/$n.chrome.png" || true
            else ./chrome-ref.sh "$f" "out/$n.chrome.png"; fi
          done
          while read -r n; do ./chrome-ref.sh "$M/$n.json" "out/mocks/$n.chrome.png"; done < out/mocks/sample.txt
          while read -r n; do ./chrome-toimage.sh "$M/$n.json" "out/gl/$n.chrome.png" || true; done < out/gl/sample.txt
          while read -r n; do MATHJAX=1 ./chrome-toimage.sh "$M/$n.json" "out/mj/$n.chrome.png" || true; done < out/mj/sample.txt
      - name: Scores
        run: |
          ls figs/*.json | xargs -n1 basename | sed 's/\.json$//' | xargs node compare.js > out/scores.txt
          for d in mocks gl mj; do OUT=out/$d xargs node compare.js < out/$d/sample.txt > out/$d/scores.txt; done
          cat out/scores.txt out/gl/scores.txt out/mj/scores.txt
      - uses: actions/upload-artifact@v4
        with:
          name: out
          path: |
            out
            bin/resvg
            !out/topojson
            !out/*.mjs

  versions:
    runs-on: macos-15
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        release: ["1.58.5", "2.35.3", "3.7.0"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: oven-sh/setup-bun@v2
      - name: Dependencies and binary
        run: |
          ./fetch-deps.sh
          npm ci --ignore-scripts --no-audit --no-fund
          native/build.sh
          bun build-qjs.js
      - name: plotly.js ${{ matrix.release }} against Chrome with ${{ matrix.release }}
        run: ./versions.sh ${{ matrix.release }}
      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.release }}
          path: |
            out/versions/${{ matrix.release }}/*/scores.txt
            out/versions/${{ matrix.release }}/*/run.log

  page:
    needs: [render, versions]
    if: ${{ !cancelled() && needs.render.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: out
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: out/versions
      - run: node docs/build.js _site
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: page
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
